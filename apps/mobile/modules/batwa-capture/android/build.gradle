plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.batwacapture'
version = '0.1.0'

android {
  namespace "expo.modules.batwacapture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Drains the pending queue with backoff, and survives process death and
  // reboot. This is what makes a message received with no signal recoverable
  // rather than lost.
  implementation "androidx.work:work-runtime-ktx:2.9.1"
  // EncryptedSharedPreferences for the ingest token.
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
